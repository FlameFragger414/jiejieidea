title = "Jiejie Gitleaks configuration"

[extend]
useDefault = true

# Deterministic, non-secret fixtures. Each entry is scoped to one test file and one exact literal
# shape, so a real credential added to the same file is still reported.
[allowlist]
description = "Deterministic non-secret literals used only by tests"
condition = "AND"
paths = [
  '''Packages/WishlistCore/Tests/WishlistCoreTests/DeepLinkTests\.swift''',
  '''supabase/functions/delete-account/deletion_test\.ts''',
]
regexTarget = "line"
regexes = [
  '''private let token = "[0-9a-f]{64}"''',
  '''const validToken = "[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+";''',
]
