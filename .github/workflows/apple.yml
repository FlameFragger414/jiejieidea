name: Apple builds

on:
  pull_request:
    paths:
      - "App/**"
      - "Config/**"
      - "Packages/**"
      - "project.yml"
      - ".github/workflows/apple.yml"
  push:
    branches:
      - main
      - "codex/**"
      - "cursor/**"
    paths:
      - "App/**"
      - "Config/**"
      - "Packages/**"
      - "project.yml"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: WishlistCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Run portable Swift tests
        run: swift test --package-path Packages/WishlistCore

  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: Jiejie-iOS
            destination: generic/platform=iOS Simulator
          - name: macOS
            scheme: Jiejie-macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project Jiejie.xcodeproj
          -scheme "${{ matrix.scheme }}"
          -resolvePackageDependencies
      - name: Build without signing
        run: >-
          xcodebuild
          -project Jiejie.xcodeproj
          -scheme "${{ matrix.scheme }}"
          -configuration Debug
          -destination "${{ matrix.destination }}"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

  app-tests:
    name: Shared service and view model tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project Jiejie.xcodeproj
          -scheme Jiejie-macOS
          -resolvePackageDependencies
      - name: Run authentication and profile tests
        run: >-
          xcodebuild
          -project Jiejie.xcodeproj
          -scheme Jiejie-macOS
          -configuration Debug
          -destination "platform=macOS"
          -only-testing:JiejieTests
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test
