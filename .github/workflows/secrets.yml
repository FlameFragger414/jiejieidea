name: Credential safety

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject tracked local configuration
        shell: bash
        run: |
          forbidden_files='^(Config/(Debug|Release)\.xcconfig|supabase/functions/\.env(\.local)?)$'
          if git ls-files | grep -E "$forbidden_files"; then
            echo "A local credential file is tracked. Remove it from Git."
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
