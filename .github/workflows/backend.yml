name: Backend verification

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
      - "codex/**"
      - "cursor/**"
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database from migrations and seed
        run: supabase db reset --local
      - name: Lint database schemas
        run: supabase db lint --local --level warning
      - name: Run RLS and database tests
        run: supabase test db
      - name: Install concurrent-test driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run final-unit concurrency test
        env:
          SUPABASE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python supabase/tests/concurrent_reservation_test.py
      - name: Check Edge Function formatting
        run: deno fmt --check supabase/functions
      - name: Lint Edge Functions
        run: deno lint supabase/functions
      - name: Type-check Edge Functions
        shell: bash
        run: |
          mapfile -d '' sources < <(find supabase/functions -name '*.ts' -print0)
          if ((${#sources[@]} == 0)); then
            echo "No Edge Function sources yet."
            exit 0
          fi
          for source in "${sources[@]}"; do
            deno check "$source"
          done
      - name: Run Edge Function tests
        shell: bash
        run: |
          if ! find supabase/functions -name '*_test.ts' -print -quit | grep -q .; then
            echo "No Edge Function tests yet."
            exit 0
          fi
          deno test supabase/functions
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
